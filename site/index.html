  <link rel="stylesheet" href="style.css">
  <style>
    .layout { display: grid; grid-template-columns: minmax(300px, 400px) 1fr; gap: 24px; align-items: start; }
    @media (max-width: 860px) { .layout { grid-template-columns: 1fr; } .layout > section { order: -1; } }

    @media (max-width: 560px) { .cards { grid-template-columns: 1fr; } }
    .card .label { font-size: 13px; color: var(--muted); font-weight: 600; }
    .card .value { font: 800 34px/1.1 var(--font); letter-spacing: -0.02em; margin: 6px 0 4px; }
    .card .sub { font-size: 13px; color: var(--muted); }

<body>
  <div class="wrap">
    <header class="top">
      <div class="langs seg" role="group" aria-label="Language"><button type="button" data-lang="en">EN</button><button type="button" data-lang="vi">VI</button></div>
      <p class="eyebrow"><a href="https://github.com/dannybosie">dannybosie</a> / tools / <a href="https://github.com/dannybosie/breakeven-roas">breakeven-roas</a></p>

      <p class="tagline" data-i="tagline"></p>
      <p class="lede" data-i="lede"></p>
    </header>

    <main class="layout">
      <form class="panel" id="form" autocomplete="off">
        <fieldset>
          <legend data-i="product"></legend>
          <div><label for="price" data-i="price"></label><input id="price" inputmode="numeric"></div>
          <div><label for="landedCost" data-i="landed"></label><input id="landedCost" inputmode="numeric"><div class="hint" data-i="landedHint"></div></div>
        </fieldset>
        <fieldset>
          <legend data-i="category"></legend>
          <div>
            <input id="cat-search" type="search" data-i-ph="searchPh">
            <ul class="cat-results" id="cat-results"></ul>
            <div class="cat-chosen" id="cat-chosen"></div>
          </div>
          <div class="two">
            <div><label data-i="tier"></label><div class="seg" id="tier"><button type="button" data-tier="standard" data-i="standard"></button><button type="button" data-tier="mall" data-i="mall"></button></div></div>
            <div><label for="commissionPct" data-i="commission"></label><input id="commissionPct" inputmode="decimal"></div>
          </div>
          <div class="hint" id="commission-hint"></div>
        </fieldset>
        <fieldset>
          <legend data-i="fees"></legend>
          <div class="two">
            <div><label for="paymentFeePct" data-i="payment"></label><input id="paymentFeePct" inputmode="decimal"></div>
            <div><label for="taxWithheldPct" data-i="tax"></label><input id="taxWithheldPct" inputmode="decimal"></div>
          </div>
          <div class="hint" data-i="taxHint"></div>
          <div class="two">
            <div><label for="voucherXtraPct" data-i="vxp"></label><input id="voucherXtraPct" inputmode="decimal"></div>
            <div><label for="orderFee" data-i="orderFee"></label><input id="orderFee" inputmode="numeric"></div>
          </div>
          <div class="hint" data-i="vxpHint"></div>
          <div><label for="shippingSubsidy" data-i="shipping"></label><input id="shippingSubsidy" inputmode="numeric"></div>
        </fieldset>
        <fieldset>
          <legend data-i="risk"></legend>
          <div class="two">
            <div><label for="returnRatePct" data-i="returns"></label><input id="returnRatePct" inputmode="decimal"></div>
            <div><label for="affiliatePct" data-i="affiliate"></label><input id="affiliatePct" inputmode="decimal"></div>
          </div>
          <div><label for="otherPct" data-i="other"></label><input id="otherPct" inputmode="decimal"><div class="hint" data-i="otherHint"></div></div>
        </fieldset>
        <fieldset>
          <legend data-i="plan"></legend>
          <div class="two">
            <div><label for="targetRoas" data-i="targetRoas"></label><input id="targetRoas" inputmode="decimal"></div>
            <div><label for="targetMarginPct" data-i="targetMargin"></label><input id="targetMarginPct" inputmode="decimal"></div>
          </div>
        </fieldset>
        <button class="btn" type="button" id="share" data-i="share"></button>
      </form>

      <section>
        <div class="cards" id="cards"></div>
        <h2 data-i="waterfall"></h2>
        <div class="panel wf" id="waterfall"></div>
        <p id="need-roas" style="margin: 14px 0 0;"></p>
        <h2 data-i="table"></h2>
        <div class="table-scroll"><table id="sens"></table></div>
        <h2 data-i="aff"></h2>
        <div class="panel" id="aff" style="font-size: 14px;"></div>
        <div class="panel cta" style="margin-top: 24px;">
          <div><b data-i="ctaTitle"></b><br><span class="muted" style="font-size: 14px;" data-i="ctaBody"></span></div>
